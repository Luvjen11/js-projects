<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="~" method="post">
        <label for="book">Book Name:</label>
        <input type="text" id="book" name="book" required>
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required>
        <label for="pages">Pages:</label>
        <input type="number" id="pages" name="pages" required>
        <input type="radio" id="read" name="read" value="read">
        <label for="read">Read</label>
        <input type="radio" id="not-read" name="read" value="not-read">
        <label for="not-read">Not Read</label>
        <button type="submit">New Book</button>
    </form>
</body>
</html>
