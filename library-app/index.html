<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library App</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <div class="library-app">
        <form action="~" method="post">
            <input type="file" id="book-cover" name="book-cover" accept=".jpg, .jpeg, .png" required>
            <label for="book">Book Name:</label>
            <input type="text" id="book" name="book" required>
            <label for="author">Author:</label>
            <input type="text" id="author" name="author" required>
            <label for="pages">Pages:</label>
            <input type="number" id="pages" name="pages" required>
            <input type="radio" id="read" name="read" value="read">
            <label for="read">Read</label>
            <input type="radio" id="not-read" name="read" value="not-read">
            <label for="not-read">Not Read</label>
            <button type="submit">Add Book</button>
        </form>
    
        <div class="book-container">
            <div class="book-card">
                <img src="book-cover.jpg" alt="Book Cover" class="book-image"/>
                <h2>Book Name</h2>
                <p>Author</p>
                <p>Pages</p>
                <button class="delete-btn">Read</button>
                <button class="delete-btn">Delete</button>
            </div>
        </div>
    </div>
    
</body>
</html>
