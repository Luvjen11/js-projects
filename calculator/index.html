<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="display">
            <input type="text" id="calc-display" value="0" disabled>
        </div>
        <div id="buttons" class="buttons">

            <button>√</button>
            <button>mod</button>
            <button>1/x</button>
            <button>10^x</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>×</button>

            <button>0</button>
            <button>.</button>
            <button>=</button>
            <button>÷</button>

            <button>←</button>
            <button>%</button>
            <button>^</button>
            <button id="clear">C</button>
        </div>
    </div>
</body>
<script src="main.js"></script>
</html>
